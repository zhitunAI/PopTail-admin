services:
  pop-tail-auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pop-tail-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POP_TAIL_BIND_ADDR: ${POP_TAIL_BIND_ADDR:-0.0.0.0:8888}
      POP_TAIL_DATABASE_URL: ${POP_TAIL_DATABASE_URL:?set POP_TAIL_DATABASE_URL}
      POP_TAIL_REDIS_URL: ${POP_TAIL_REDIS_URL:-redis://redis:6379/0}
      POP_TAIL_JWT_SECRET: ${POP_TAIL_JWT_SECRET:?set POP_TAIL_JWT_SECRET}
      POP_TAIL_SERVICE_MODERATION_TOKEN: ${POP_TAIL_SERVICE_MODERATION_TOKEN:?set POP_TAIL_SERVICE_MODERATION_TOKEN}
      POP_TAIL_BOOTSTRAP_ADMIN_PASSWORD: ${POP_TAIL_BOOTSTRAP_ADMIN_PASSWORD:?set POP_TAIL_BOOTSTRAP_ADMIN_PASSWORD}
      POP_TAIL_DEFAULT_USER_PASSWORD: ${POP_TAIL_DEFAULT_USER_PASSWORD:?set POP_TAIL_DEFAULT_USER_PASSWORD}
      POP_TAIL_MULTIPOINT_ENABLED: ${POP_TAIL_MULTIPOINT_ENABLED:-true}
      POP_TAIL_COMPATIBILITY_REFRESH_HEADERS: ${POP_TAIL_COMPATIBILITY_REFRESH_HEADERS:-true}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8888:8888"

  postgres:
    image: postgres:16-alpine
    container_name: pop-tail-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pop_tail_auth
      POSTGRES_USER: pop_tail
      POSTGRES_PASSWORD: ${POP_TAIL_POSTGRES_PASSWORD:?set POP_TAIL_POSTGRES_PASSWORD}
    ports:
      - "15432:5432"
    volumes:
      - pop-tail-auth-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pop_tail -d pop_tail_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pop-tail-auth-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - pop-tail-auth-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pop-tail-auth-postgres:
  pop-tail-auth-redis:

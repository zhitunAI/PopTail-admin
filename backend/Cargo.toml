[package]
name = "pop-tail-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
argon2 = "0.5"
casbin = { version = "2.5", default-features = false, features = ["runtime-tokio"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
http = "1.1"
hex = "0.4"
jsonwebtoken = "9.3"
rand = "0.8"
redis = { version = "0.27", features = ["tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres"] }
thiserror = "1.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tower = "0.5"
